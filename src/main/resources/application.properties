# Server Configuration
server.port=8080
spring.application.name=student-report-backend

# MySQL Database Configuration
# 真实连接信息不进代码：本地开发用默认值即可，部署时通过环境变量覆盖
# 例：DB_HOST=数据库地址 DB_USERNAME=数据库账号 DB_PASSWORD=数据库密码
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:student_report}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

# JPA Configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS Configuration
# 部署时通过 CORS_ALLOWED_ORIGIN 指定前端实际访问来源
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGIN:http://localhost:8080}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true